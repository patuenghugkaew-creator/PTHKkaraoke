name: Build KaraMixer Edition installer (own PC, self-hosted runner)

# Builds on the owner's own Windows PC with a GitHub self-hosted runner: no GitHub minutes are used.
# Needs on that PC: Visual Studio Build Tools (C++), Qt 5.15.2 (msvc2019_64 + msvc2019), Inno Setup 6, GitHub CLI (gh).

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]

permissions:
  contents: write

env:
  QT_ROOT: C:\Qt\5.15.2

jobs:
  build:
    runs-on: [ self-hosted, windows ]
    strategy:
      max-parallel: 1        # one PC: build x64, then x86
      fail-fast: false
      matrix:
        include:
          - arch: x64
            qtdir: msvc2019_64
          - arch: x86
            qtdir: msvc2019
    steps:
      - uses: actions/checkout@v4

      - name: Qt ${{ matrix.arch }} on PATH
        shell: pwsh
        run: |
          $qt = "${{ env.QT_ROOT }}\${{ matrix.qtdir }}\bin"
          if (-not (Test-Path "$qt\qmake.exe")) { throw "Qt not found: $qt" }
          Add-Content -Path $env:GITHUB_PATH -Value $qt

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Build VSTChecker
        shell: cmd
        run: |
          if exist build-vstchecker rmdir /s /q build-vstchecker
          mkdir build-vstchecker
          cd build-vstchecker
          qmake ..\3rdParty\VSTChecker\VSTChecker.pro CONFIG+=release
          nmake

      - name: Build KaraMixer Edition
        shell: cmd
        run: |
          if exist build-mixer rmdir /s /q build-mixer
          mkdir build-mixer
          cd build-mixer
          qmake ..\PTHKKaraoke.pro CONFIG+=release
          nmake

      - name: Compile translations
        shell: cmd
        run: lrelease languages\en.ts -qm languages\en.qm

      - name: Collect files (windeployqt + BASS)
        shell: pwsh
        run: |
          $arch = "${{ matrix.arch }}"
          $d = "deploy\$arch"
          $sub = if ($arch -eq "x64") { "x64\" } else { "" }
          if (Test-Path $d) { Remove-Item -Recurse -Force $d }
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item build-mixer\release\KaraMixer.exe $d
          Copy-Item (Get-ChildItem -Recurse build-vstchecker -Filter "VSTChecker_$arch.exe" | Select-Object -First 1).FullName $d
          $libs = @("bass24\bass.dll","bass_fx24\bass_fx.dll","bass_vst24\bass_vst.dll","bassmidi24\bassmidi.dll","bassmix24\bassmix.dll","bassasio14\bassasio.dll")
          foreach ($l in $libs) {
            $parts = $l.Split("\")
            Copy-Item ("BASS\" + $parts[0] + "\" + $sub + $parts[1]) $d
          }
          New-Item -ItemType Directory -Force "$d\languages" | Out-Null
          Copy-Item languages\en.qm "$d\languages"
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw "$d\KaraMixer.exe"
          # app-local copy of the newest Visual C++ runtime DLLs (the program is built with the newest compiler and needs a
          # new msvcp140/vcruntime140: Windows 10 PCs with an older runtime would not start it at all)
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          if ($vs) {
            $ver = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt" -ErrorAction SilentlyContinue | Select-Object -First 1)
            if ($ver) {
              $crtDir = Get-ChildItem "$vs\VC\Redist\MSVC\$($ver.Trim())\$arch\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($crtDir) {
                Copy-Item "$($crtDir.FullName)\*.dll" $d -Force
                Write-Host "copied Visual C++ runtime from $($crtDir.FullName)"
              } else { Write-Host "WARNING: CRT folder not found" }
            }
          }
          if (-not (Test-Path "deploy\VC_redist.$arch.exe")) {
            Invoke-WebRequest "https://aka.ms/vs/17/release/vc_redist.$arch.exe" -OutFile "deploy\VC_redist.$arch.exe"
          }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 is not installed" }
          & $iscc "/DAppVersion=4.0.1" "_iss_setup\karamixer-${{ matrix.arch }}.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Installer goes to the Releases page
      - name: Attach installer to a GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-${{ github.run_number }}"
          gh release create $tag --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease --title "Build ${{ github.run_number }}" --notes "Automatic build of commit ${{ github.sha }}" 2>$null
          $global:LASTEXITCODE = 0   # the other architecture's job may have created it already
          Get-ChildItem dist\*.exe | ForEach-Object {
            gh release upload $tag $_.FullName --repo "${{ github.repository }}" --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
